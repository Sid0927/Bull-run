# Render Blueprint: New → Blueprint → pick this repository. Render asks for the three secrets below.
services:
  - type: web
    name: bull-run
    runtime: node
    plan: free
    region: singapore # closest Render region to India; create the Neon database in Singapore too
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node --import tsx server/index.ts # not "npm start": npm would not pass the stop signal on
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY # Render's proxy adds the caller's address to X-Forwarded-For
        value: "1"
      - key: DATABASE_URL
        sync: false # Neon connection string
      - key: ADMIN_USERNAME
        sync: false # the admin account created on first start
      - key: ADMIN_PASSWORD
        sync: false
