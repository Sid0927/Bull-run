name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Server tests against Postgres
        run: node --import tsx --test --test-force-exit server/server.test.ts
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
      - run: npm run build
      - run: npm run sim -- --games 500 --players 4 --rounds 9
